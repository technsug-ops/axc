# ============================================================================
#  K166 — TY ÇEKİM TETİKLEYİCİSİ (YEDEK zamanlayıcı — bkz. 10.09.2026 notu)
# ----------------------------------------------------------------------------
#  Neden GitHub Actions: dış hesap istemez, HER koşumun logu Actions
#  sekmesinde durur (Vercel Cron'un 18-19.08 sessiz kaçışı bu yüzden
#  birincil sayılmıyor — anayasa). Bilinen sınır: schedule "elinden
#  geldiğince"dir, yoğun saatlerde dakikalar sarkabilir — kaçış zaten
#  panel rozeti + AuditLog iziyle görünür; Vercel günlük yedeği ve
#  makinedeki görevler ayrıca duruyor (çift tetik zararsız, kanıtlı).
#
#  KAPSAM: bu tek is UC KANALI da cagirir — TY · N11 · HB. Dosya adi
#  tarihsel olarak `ty-cekim.yml`; yeniden adlandirilmadi cunku is gecmisi
#  ve zamanlayici kaydi ona bagli. Icerik adindan genis oldugunda ADI degil
#  ICERIGI yaziyoruz — okuyan yanilmasin diye burada duruyor.
#
#  HB NEDEN SONRADAN EKLENDI (08.09.2026): olculdu — HB ice aktarmasi
#  canlida 2 kez kosmustu (ikisi de elle), TY ayni gun 817 kez. Sebep:
#  HB icin tetikleyici HIC kurulmamisti; Halil siparisleri elle giriyordu
#  ve iki siparis (9.078 TL) aylarca defterde yoktu.
#
#  SIR: depo Secrets → CRON_SECRET (Vercel'dekiyle AYNI değer).
#  Sır tanımsızsa istek boş Bearer taşır ve uç 404 döner — güvenli.
#
#  ⚠ ROL DEGISTI 08.09.2026 — BU AKIS ARTIK BIRINCIL DEGIL, YEDEK.
#  (eski cumle, o gunku dogru bilgiydi — asagida ikinci kez cevrildi)
#  O gun birincil tetik Halil'in makinesindeki Gorev Zamanlayici olmustu
#  (`Selliora Kanal Sik Cekim`, 5 dk, `scripts/kanal-sik-cekim.cmd`).
#
#  ⚠ ROL YENIDEN DEGISTI 10.09.2026 — BIRINCIL ARTIK cron-job.org.
#  Kullanici sordu: "cekim neden bilgisayarima bagimli". Kok sebep
#  OLCULDU (bu akisin GERCEK kosum gecmisi API'den cekildi): schedule
#  "10 dk" DEGIL, gercekte SAATLER arayla tetikleniyordu (2-6 saat
#  bosluklar) — GitHub'in belgelenmis bir platform siniri, kisa
#  araliklarda "elinden geldiginde" davraniyor. Ayrica HB adimi
#  08.09'dan beri HER kosumda 401 aliyordu (proxy.ts'teki ACIK_YOLLAR
#  listesine hb-cekim hic eklenmemisti — K166'nin AYNI dersi, ikinci
#  kez tekrarlanmisti; bkz. `cron-yollari:dogrula`, 10.09.2026).
#
#  Birincil simdi cron-job.org (ucuncu taraf, dakika hassasiyetinde,
#  bilgisayardan VE GitHub'in kendi zamanlama sinirindan BAGIMSIZ) —
#  Vercel uclarini dogrudan cagirir, ne bu akisi ne yerel makineyi
#  gerektirir. Bu akis (10 dk, "elinden geldiginde") VE yerel gorev
#  (artik 1 saat, `kanal-sik-cekim.cmd`in kendi basligina bakin) ikisi
#  de YEDEK olarak kaldi — cift/uclu tetik zararsiz ve kanitli
#  (cakisan siparis ATLANIR, ezme yok).
#
#  ⭐ VE ONERIMI GERI ALIYORUM: once "kaldirilsin" demistim. Olcum fikri
#  cevirdi — 05.09-08.09 arasi klon otomatik onayi HIC yapamazken kuyrugu
#  bosaltan sey bu akisti (son 24 saatte 7 N11 izi, N11'in yerel gorevi YOK).
#  Yani Vercel yolunu FIILEN kosturan tek sey buydu; yedegi silmek, o
#  yolun bir daha hic sinanmamasi olurdu.
#
#  ⭐ VE ARTIK BIR SORUYU DA CEVAPLIYOR: HB ucu kimliksizken 503 donuyor ve
#  eksik degisken ADINI gövdeye yaziyor (`cat cevap-hb.json` basiyor).
#  Yani "HB anahtarlari Vercel env'inde var mi" sorusunu bir sonraki kosum
#  kendisi cevaplar — cikarimla degil, logla.
# ============================================================================
name: Kanal cekimleri (10 dk)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  tetikle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ucu cagir
        run: |
          KOD=$(curl -s -o cevap.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://axc-seven.vercel.app/api/cron/ty-cekim")
          echo "HTTP $KOD"
          cat cevap.json || true
          # 404 = sir eslesmiyor (kurulum eksik) — is KIRMIZI biter ki
          # sessiz kacis olmasin; 200 disi her sey de kirmizi.
          test "$KOD" = "200"
      # K167-③: N11 ucu — TY adımı kırmızı olsa da koşar (iki kanal bağımsız).
      - name: N11 ucunu cagir
        if: always()
        run: |
          KOD=$(curl -s -o cevap-n11.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://axc-seven.vercel.app/api/cron/n11-cekim")
          echo "HTTP $KOD"
          cat cevap-n11.json || true
          test "$KOD" = "200"

      # K-HB-CRON (08.09.2026): HB ucu — oteki ikisi kirmizi olsa da kosar.
      # Uc kanal BAGIMSIZ: birinin dusmesi otekini engellemez, yoksa bir
      # kanalin arizasi hepsini sessizce durdururdu.
      - name: HB ucunu cagir
        if: always()
        run: |
          KOD=$(curl -s -o cevap-hb.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://axc-seven.vercel.app/api/cron/hb-cekim")
          echo "HTTP $KOD"
          cat cevap-hb.json || true
          test "$KOD" = "200"
